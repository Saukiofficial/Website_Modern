name: Deploy Laravel to Vercel

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gd, zip, pgsql, pdo_pgsql
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Setup .env before build
        run: |
          cp .env.example .env
          sed -i 's|APP_URL=http://localhost|APP_URL=https://website-modern-sekolah.vercel.app|' .env
          php artisan key:generate --force

      - name: Build frontend assets
        run: npm run build

      - name: Prepare storage directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 bootstrap/cache storage

      - name: Run database migration
        run: |
          MIGRATE_DB_URL=$(echo "$DB_URL_SECRET" | sed 's/-pooler//')
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_URL=$MIGRATE_DB_URL" >> .env
          echo "DB_SSLMODE=require" >> .env
          php artisan migrate:fresh --force
        env:
          DB_URL_SECRET: ${{ secrets.DB_URL }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
